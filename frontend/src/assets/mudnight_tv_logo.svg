<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300">
  <defs>
    <!-- Crescent: outer circle (150,140) r105 minus inner circle (195,110) r90.
         Tips land where the two circles intersect. -->
    <path id="crescent" d="M 145 35 A 105 105 0 1 0 245 185 A 90 90 0 0 1 145 35 Z"/>
    <clipPath id="moon-clip">
      <use href="#crescent"/>
    </clipPath>
    <!-- Geometric monoline caps: flat terminals, true-circle bowls -->
    <g id="word">
      <path d="M 296 160 V 70 L 323 128 L 350 70 V 160"/>
      <path d="M 384 70 V 133 A 27 27 0 0 0 438 133 V 70"/>
      <path d="M 472 70 V 160 H 478 A 45 45 0 0 0 478 70 Z"/>
      <path d="M 557 160 V 70 L 607 160 V 70"/>
      <path d="M 641 70 V 160"/>
      <path d="M 751.8 83.2 A 45 45 0 1 0 765 115 H 726"/>
      <path d="M 799 70 V 160 M 851 70 V 160 M 799 115 H 851"/>
      <path d="M 881 70 H 937 M 909 70 V 160"/>
    </g>
  </defs>

  <!-- moon -->
  <use href="#crescent" fill="#f3e7b3"/>

  <!-- mud coating the underside of the moon, wavy where it meets the clean surface -->
  <g fill="#9a6230">
    <path clip-path="url(#moon-clip)"
          d="M 30 168 C 60 152, 80 192, 110 184 C 140 176, 160 206, 190 196
             C 215 188, 235 202, 262 186 L 262 270 L 30 270 Z"/>

    <!-- drips hanging off the bottom edge; tops tuck inside the coating -->
    <path d="M 98 228 C 98 248, 102 258, 102 270 A 10 10 0 0 0 122 270 C 122 258, 126 248, 126 228 Z"/>
    <path d="M 142 236 C 142 256, 146 266, 146 278 A 10 10 0 0 0 166 278 C 166 266, 170 256, 170 236 Z"/>
    <path d="M 192 226 C 192 240, 195 246, 195 252 A 8 8 0 0 0 211 252 C 211 246, 214 240, 214 226 Z"/>

    <!-- falling drop -->
    <ellipse cx="112" cy="292" rx="6" ry="7"/>
  </g>

  <!-- MUDNIGHT with the same hard arcade offset shadow as the old wordmark,
       nudged down 20 to sit a touch lower against the moon -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-linecap="butt">
      <use href="#word" stroke="#ff7b00" stroke-width="15" transform="translate(4,25)"/>
      <use href="#word" stroke="#a259ff" stroke-width="15" transform="translate(0,20)"/>
    </g>

    <!-- TV tag, tilted up off the end of the word with the colours swapped -->
    <g transform="translate(998,100) rotate(-12)">
      <path d="M 0 0 H 50 M 25 0 V 100 M 74 0 L 98 100 L 122 0"
            stroke="#a259ff" stroke-width="24" transform="translate(5,6)"/>
      <path d="M 0 0 H 50 M 25 0 V 100 M 74 0 L 98 100 L 122 0"
            stroke="#ff7b00" stroke-width="24"/>
    </g>
  </g>
</svg>
